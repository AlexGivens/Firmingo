name: Firmware foundations
on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    # Explicit bash enables pipefail so tee cannot hide test/build failures.
    shell: bash

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0, Node 24
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Native sanitizer and host harness tests
        run: |
          mkdir -p build
          .venv/bin/python tools/dev.py test --sanitize 2>&1 | tee build/native-check.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        if: always()
        with:
          name: native-test-logs
          path: |
            build/native-check.log
            build/native-sanitize/Testing/Temporary/*.log
          if-no-files-found: ignore

  mutation-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Bounded DHCP, protocol, session, managed-upload, FMS2 and target-2 adapter mutations
        run: |
          mkdir -p build/fuzz
          .venv/bin/cmake -S . -B build/fuzz -DFIRMINGO_SANITIZE=ON -DFIRMINGO_DHCP_FUZZ=ON -DFIRMINGO_PROTOCOL_FUZZ=ON -DFIRMINGO_UPLOAD_FUZZ=ON -DFIRMINGO_STATEFUL_FUZZ=ON -DFIRMINGO_STATEFUL_UPLOAD_FUZZ=ON 2>&1 | tee build/fuzz/configure.log
          .venv/bin/cmake --build build/fuzz --parallel 2 2>&1 | tee build/fuzz/build.log
          .venv/bin/ctest --test-dir build/fuzz -R '_fuzz$' --output-on-failure 2>&1 | tee build/fuzz/test.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: mutation-fuzz-logs
          path: |
            build/fuzz/*.log
            build/fuzz/Testing/Temporary/*.log
          if-no-files-found: ignore

  firmware-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nano_rp2040_connect
            firmware: baseline
          - board: nano_rp2040_connect
            firmware: local-only
          - board: nano_rp2040_connect
            firmware: application
          - board: nano_rp2040_connect
            firmware: uart
          - board: raspberry_pi_pico
            firmware: local-only
          - board: raspberry_pi_pico
            firmware: application
          - board: raspberry_pi_pico
            firmware: uart
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-firmware
      - name: Compile selected firmware
        env:
          BUILD_BOARD: ${{ matrix.board }}
          BUILD_FIRMWARE: ${{ matrix.firmware }}
        run: |
          output="build/firmware/$BUILD_BOARD"
          if [ "$BUILD_FIRMWARE" != baseline ]; then
            output="$output/$BUILD_FIRMWARE"
          fi
          mkdir -p "$output"
          echo "FIRMWARE_OUTPUT=$output" >> "$GITHUB_ENV"
          python tools/dev.py build --board "$BUILD_BOARD" --firmware "$BUILD_FIRMWARE" 2>&1 | tee "$output/driver.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && env.FIRMWARE_OUTPUT != ''
        with:
          name: ${{ matrix.board }}-${{ matrix.firmware }}-build
          path: |
            ${{ env.FIRMWARE_OUTPUT }}/*.log
            ${{ env.FIRMWARE_OUTPUT }}/report.json
            ${{ env.FIRMWARE_OUTPUT }}/artifacts/*
          if-no-files-found: error

  managed-sketch-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-firmware
      - name: Build managed profile through the ordinary development entry point
        run: |
          mkdir -p build/firmware/nano_rp2040_connect/managed
          python tools/dev.py build --board nano_rp2040_connect --firmware managed 2>&1 | tee build/firmware/nano_rp2040_connect/managed/driver.log
      - name: Compile experimental resident, capsules and initial images
        run: |
          overlay=build/firmware/nano_rp2040_connect/managed/usb-toolchain
          output=build/managed_sketch/ci
          mkdir -p "$output"
          # Use the exact independently checked output; do not rebuild a second resident.
          cp -R build/firmware/nano_rp2040_connect/managed/resident "$output/resident"
          # Compile the portable candidate for ARM without linking it into this
          # ABI-one resident or claiming an allocated sketch-RAM window.
          "$overlay/data/packages/rp2040/tools/pqt-gcc/5.0.0-9576866/bin/arm-none-eabi-g++" \
            -std=c++11 -Wall -Wextra -Wpedantic -Werror -ffreestanding \
            -fno-exceptions -fno-rtti -mcpu=cortex-m0plus -mthumb \
            -Iexperiments/managed_sketch -c experiments/managed_sketch/stateful_image.cpp \
            -o "$output/stateful_image.o" 2>&1 | tee "$output/stateful-object-driver.log"
          "$overlay/data/packages/rp2040/tools/pqt-gcc/5.0.0-9576866/bin/arm-none-eabi-g++" \
            -std=c++11 -Wall -Wextra -Wpedantic -Werror -ffreestanding \
            -fno-exceptions -fno-rtti -mcpu=cortex-m0plus -mthumb \
            -Iexperiments/managed_sketch -c experiments/managed_sketch/stateful_runtime.cpp \
            -o "$output/stateful_runtime.o" 2>&1 | tee "$output/stateful-runtime-object-driver.log"
          "$overlay/data/packages/rp2040/tools/pqt-gcc/5.0.0-9576866/bin/arm-none-eabi-g++" \
            -std=c++11 -Wall -Wextra -Wpedantic -Werror -ffreestanding \
            -fno-exceptions -fno-rtti -mcpu=cortex-m0plus -mthumb -Isrc \
            -Iexperiments/managed_sketch -c experiments/managed_sketch/stateful_upload.cpp \
            -o "$output/stateful_upload.o" 2>&1 | tee "$output/stateful-upload-object-driver.log"
          python experiments/managed_sketch/export_resident.py --resident-dir "$output/resident" --firmware-commit "$GITHUB_SHA" --output "$output/resident-export" 2>&1 | tee "$output/resident-export-driver.log"
          for sketch in blink_a blink_b pause_probe stall_probe; do
            python experiments/managed_sketch/build_module.py --sketch "$sketch" --resident-elf "$output/resident/artifacts/firmingo_managed_resident.ino.elf" --toolchain-bin "$overlay/data/packages/rp2040/tools/pqt-gcc/5.0.0-9576866/bin" --output-dir "$output" 2>&1 | tee "$output/$sketch-driver.log"
          done
          for sketch in blink_a blink_b; do
            python experiments/managed_sketch/build_composite.py --sketch "$sketch" --resident-dir "$output/resident" --module-dir "$output" --output-dir "$output/composite"
          done
          # Exercise selected-artifact composition with real native proof bytes.
          # SDK/WASM hardware qualification remains a separately selected check.
          python experiments/managed_sketch/compose_initial.py \
            --resident-uf2 "$output/resident/artifacts/firmingo_managed_resident.ino.uf2" \
            --expected-resident-sha256 "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["uf2_sha256"])' "$output/resident/report.json")" \
            --capsule "$output/blink_a/blink_a.fms" \
            --expected-capsule-sha256 "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["capsule_sha256"])' "$output/blink_a/report.json")" \
            --expected-api-address "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["api_address"])' "$output/blink_a/report.json")" \
            --output-dir "$output/selected-initial"
          python experiments/managed_sketch/export_sdk_contract.py --output "$output/sdk-contract.zip"
      - name: Link candidate stateful ARM sketch against allocated resident RAM
        run: |
          output=build/managed_sketch/ci
          cmake -S . -B build/stateful-check -DFIRMINGO_SANITIZE=ON 2>&1 | tee "$output/stateful-check-configure.log"
          cmake --build build/stateful-check --target managed_stateful_check --parallel 2 2>&1 | tee "$output/stateful-check-build.log"
          python experiments/managed_sketch/build_stateful_proof.py \
            --cli "$(command -v arduino-cli)" \
            --config-file build/firmware/nano_rp2040_connect/managed/usb-toolchain/arduino-cli.yaml \
            --validator build/stateful-check/managed_stateful_check \
            --output-dir "$output/stateful" 2>&1 | tee "$output/stateful-driver.log"
      - name: Build opt-in FMS2 boot runtime and check its linked capsule on the host
        run: |
          output=build/managed_sketch/ci
          python experiments/managed_sketch/build_stateful_proof.py --boot-runtime \
            --cli "$(command -v arduino-cli)" \
            --config-file build/firmware/nano_rp2040_connect/managed/usb-toolchain/arduino-cli.yaml \
            --validator build/stateful-check/managed_stateful_check \
            --output-dir "$output/stateful-runtime" 2>&1 | tee "$output/stateful-runtime-driver.log"
      - name: Build FMS2 upload candidate and export versioned contract from exact committed sources
        run: |
          output=build/managed_sketch/ci
          python experiments/managed_sketch/build_stateful_proof.py --upload-runtime \
            --cli "$(command -v arduino-cli)" \
            --config-file build/firmware/nano_rp2040_connect/managed/usb-toolchain/arduino-cli.yaml \
            --validator build/stateful-check/managed_stateful_check \
            --output-dir "$output/stateful-upload" 2>&1 | tee "$output/stateful-upload-driver.log"
          python experiments/managed_sketch/export_stateful.py \
            --resident-dir "$output/stateful-upload/resident" --firmware-commit "$GITHUB_SHA" \
            --output "$output/stateful-export" 2>&1 | tee "$output/stateful-export-driver.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: nano-managed-sketch-experimental-build
          path: |
            build/managed_sketch/ci/resident-export/**
            build/managed_sketch/ci/stateful-export/**
            build/managed_sketch/ci/*.log
            build/managed_sketch/ci/**/*.json
            build/managed_sketch/ci/**/*.log
            build/managed_sketch/ci/**/*.elf
            build/managed_sketch/ci/**/*.uf2
            build/managed_sketch/ci/**/*.fms
            build/managed_sketch/ci/*.o
            build/managed_sketch/ci/**/*.o
            build/managed_sketch/ci/**/*.map
            build/stateful-check/CMakeFiles/CMakeConfigureLog.yaml
            build/managed_sketch/ci/*.zip
            build/firmware/nano_rp2040_connect/managed/*.json
            build/firmware/nano_rp2040_connect/managed/*.log
            build/firmware/nano_rp2040_connect/managed/resident/**
          if-no-files-found: ignore
